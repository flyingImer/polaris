name: PR 4061 validation
on:
  push:
    branches: [ "validation/pr4061-gates" ]
permissions:
  contents: read
concurrency:
  group: pr4061-validation
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: ./.github/actions/setup-test-env
      - uses: ./.github/actions/ci-incr-build-cache-prepare
      - name: Format and compile
        run: ./gradlew format compileAll --max-workers=2
      - name: Verify formatting leaves sources unchanged
        run: git diff --exit-code
      - name: Runtime service checks
        run: ./gradlew :polaris-runtime-service:check --max-workers=2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr4061-validation-results
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: ignore
