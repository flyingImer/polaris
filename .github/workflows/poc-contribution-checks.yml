name: One-time proposal PoC contribution checks
on:
  push:
    branches: ['poc/validate-proposal-snapshots']
permissions:
  contents: read
jobs:
  contribution-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'c60032800b9896e968aed2512d97459e1d153dc0'
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: ./gradlew format compileAll rat
      - run: git diff --exit-code
